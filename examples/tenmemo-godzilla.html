  technique:{path:"M1114 546Q1198 544 1196 440M1228 300Q1226 322 1234 336M1245 357Q1238 383 1243 407",color:"#985340",refs:["w2","s0","s1","s2"],label:"大きさをどう画面に置いたか",sourceIndex:15,reason:"カメラ角度の話から、海面や壊れる街の具体へ移る。視覚効果を、賞の名前から実際の制作の仕事へ戻して見る線。"}
  ,
  market:{path:"M101 140Q104 158 134 166 M151 181Q152 194 160 198",color:"#315975",refs:["m0","m1","m2"],label:"劇場に届いた跡",reason:"米国公開、北米での白黒版上映、北米興収はそれぞれ上映の経路、形、規模を示している。"},
  practice:{path:"M818 464Q823 481 850 492 M862 508Q875 523 885 533",color:"#8d3c35",refs:["w0","w1","w2","s0","s1","s2"],label:"フロアから画づくりへ",reason:"同じ場所での話しやすさを語る当事者が、修正やカメラ角度の提案も具体的に説明している。"},
  scars:{path:"M75 480Q75 497 88 505 M96 522Q103 546 123 551",color:"#554e71",refs:["h0","h1","h2"],label:"生き残ったあとを読む",reason:"二つの批評を並べると、怪獣の恐ろしさと並んで、戦後の暮らしに戻ろうとする人が見えてくる。"},
  before:{path:"M335 162C469 105 620 110 744 159",color:"#315975",refs:["m1","v0"],label:"白黒版は受賞前",note:[515,112,"白黒版１月、受賞３月"],reason:"北米白黒版は2024年1月、第96回アカデミー賞は同年3月。受賞は、すでに届き始めていた作品に加わった別の出来事。"},
  credit:{path:"M1015 172C1123 226 1101 300 1085 350C1070 400 1010 423 969 441",color:"#8d3c35",refs:["v0","v1","w0"],label:"受賞から制作の現場へ",reason:"受賞した人を起点にインタビューを読むと、作品の評価から、同じフロアにいた人の仕事に戻れる。"},
  time:{path:"M81 127C-9 164 21 339 17 498C10 618 41 670 145 693C250 718 309 687 329 657",color:"#315975",dash:"4 7",refs:["m0","n2"],label:"約４週間と、３日",sourceIndex:8,note:[227,724,"約４週間 ／ ３日"],reason:"前作は日本公開から米国公開まで約４週間、続編は日本公開から北米広域公開まで３日。公開間隔の比較。東宝の担当者は前作の海外ヒットを機会と捉え、続編では企画段階から海外公開を決めたと語る。"},
  evidence:{path:"M566 653Q580 650 590 645",color:"#256254",refs:["n2","publish"],label:"３日は同時期公開の一例",sourceIndex:8,reason:"日本公開から３日後の北米公開は、東宝が取り組んだ世界同時期公開の一例。"},
  support:{path:"M657 665H703 M680 665V687 M680 687C631 688 562 697 525 723 M680 687C726 688 821 697 873 723 M499 723H551 M847 723H899",color:"#256254",refs:["publish","n3","schedule"],label:"世界同時期公開を支えた仕事",sourceIndex:8,reason:"続編では企画の時点で海外展開を決め、海外担当者の助言を得ながら撮影日程を組んだ。丸めた括弧で、その公開を下から支えた二つの仕事を示す。"},
  story:{path:"M315 551Q398 524 484 549",color:"#554e71",dash:"3 5",refs:["h1","h2","n0"],label:"評された人の物語が、次へ",sourceIndex:8,reason:"批評家が目を向けた戦後の暮らし。その物語を担った敷島たちが続編にも戻る。東宝のプロデューサーは、前作の戦後日本という舞台が海外で作品の個性になったと振り返り、続編の予告編でも日本らしさを意識したと語る。"}
};

const events = [
  {topic:0},{point:"m0"},{point:"m1"},{point:"m2"},{trace:"market"},
  {topic:1},{point:"v0"},{point:"v1"},{point:"j0"},{point:"j1"},{point:"j2"},{trace:"awards"},
  {topic:2},{point:"w0"},{point:"w1"},{point:"w2"},{point:"s0"},{point:"s1"},{point:"s2"},{trace:"technique"},{trace:"practice"},{trace:"credit"},
  {topic:3},{point:"h0"},{point:"h1"},{point:"h2"},{trace:"scars"},
  {topic:4},{point:"n0"},{point:"n1"},{point:"n2"},{point:"n3"},{point:"schedule"},{point:"n4"},
  {topic:5},{point:"a0"},{point:"a1"},{point:"a2"},{trace:"subtitled"},
  {point:"a3"},{point:"a4"},{trace:"rights"},
  {point:"b0"},{point:"b1"},{point:"b2"},{point:"b3"},
  {caption:"図の上で読み返す",reason:"北米での上映日と受賞日、前作と続編の日米公開日、批評が見た人物と続編の登場人物、前作の自社配給とGKIDSの役割を行き来する。"},
  {trace:"before"},{trace:"time"},{trace:"story"},{trace:"releaseBridge"},{trace:"nextteam"},
  {point:"publish"},{trace:"evidence"},{trace:"support"},
  {caption:"まとまって見えたところを囲む",reason:"問いを残したまま、関わりが見えた点の近くに群れの名前を書く。",names:true}
];

const svg = document.querySelector("#map");
const detail = document.querySelector("#detail");
const range = document.querySelector("#progress");
const count = document.querySelector("#count");
const NS = "http://www.w3.org/2000/svg";
let selection = null;
let step = events.length;
range.max = String(events.length);

function shape(parent, tag, attributes={}, content="") {
  const el = document.createElementNS(NS, tag);
  for (const [name,value] of Object.entries(attributes)) el.setAttribute(name, value);
  if (content) el.textContent = content;
  parent.append(el);
  return el;
}

function selectable(element, label, item) {
  element.setAttribute("tabindex","0");
  element.setAttribute("role","button");
  element.setAttribute("aria-label", label);
  function choose() {
    selection = selection?.id === item.id ? null : item;
    render();
    svg.querySelector('[data-id="' + item.id + '"]')?.focus({preventScroll:true});
  }
  element.dataset.id = item.id;
  element.addEventListener("click", choose);
  element.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      choose();
    }
  });
}

function labelInfo(label, reason, extra="", sourceIndex) {
  detail.replaceChildren();
  const heading = document.createElement("strong");
  heading.textContent = label;
  detail.append(heading, document.createTextNode(reason));
  if (extra) {
    const small = document.createElement("small");
    small.textContent = extra;
    detail.append(small);
    if (sourceIndex !== undefined) {
      const [publisher,,url] = source_text.sources[sourceIndex];
      const link = document.createElement("a");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = publisher+"の原文 ↗";
      detail.append(link);
    }
  }
}

function render() {
  svg.replaceChildren();
  range.value = String(step);
  count.value = step + " / " + events.length;
  document.querySelector("#back").disabled = step === 0;
  document.querySelector("#next").disabled = step === events.length;
  const seen = events.slice(0, step);
  const names = seen.some(event => event.names);
  const existing = new Set(seen.map(event => event.point).filter(Boolean));
  const marker = shape(shape(svg,"defs"),"marker",{id:"arrow",viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:6,markerHeight:6,orient:"auto"});
  shape(marker,"path",{d:"M1 1L9 5 1 9",fill:"none",stroke:"context-stroke","stroke-width":1.4});
  const areaLayer = shape(svg,"g",{"aria-hidden":"true"});
  if (names) {
    for (const [id] of groups) {
      const field = fields[id];
      const active = selection?.id === id;
      shape(areaLayer,"path",{d:field.path,fill:field.color,"fill-opacity":active ? .17 : .062,stroke:field.color,"stroke-opacity":active ? .77 : .37,"stroke-width":active?2.15:1.05});
    }
  }

  shape(svg,"ellipse",{cx:600,cy:369,rx:128,ry:62,fill:"#fbf7eb",stroke:"#17313c","stroke-width":1.7});
  shape(svg,"text",{x:600,y:360,fill:"#17313c","font-size":35,"font-weight":700,"text-anchor":"middle"},"ゴジラ-1.0");
  shape(svg,"text",{x:600,y:398,fill:"#17313c","font-size":25,"font-weight":700,"text-anchor":"middle"},"が与えた影響");

  for (const event of seen.filter(event => event.topic !== undefined)) {
    const topic = topics[event.topic];
    const group = shape(svg,"g",{class:"point question"});
    shape(group,"path",{d:topic.spoke,fill:"none",stroke:"#46555a","stroke-width":1.3,"stroke-linecap":"round","aria-hidden":"true",class:"question-link"});
    if (event.topic === 4 ? existing.has("publish") : topic.refs.some(id => existing.has(id))) {
      shape(group,"path",{d:topic.path,fill:"none",stroke:topic.ink,"stroke-width":1.25,"stroke-opacity":.6});
    }
    shape(group,"circle",{cx:topic.x,cy:topic.y-5,r:12,fill:topic.ink,"fill-opacity":0});
    shape(group,"path",{d:"M"+topic.x+" "+(topic.y-10)+"l5 5-5 5-5-5Z",fill:"#fbf7eb",stroke:topic.ink,"stroke-width":1.55});
    shape(group,"text",{x:topic.x+12,y:topic.y,fill:topic.ink,"font-size":17,"font-weight":700},topic.title);
    const refs = topic.refs.filter(id => existing.has(id));
    selectable(group,topic.title,{id:"topic"+event.topic,label:topic.title,reason:refs.length?"この問いから拾った点が浮かびます。":"この問いで気になった点を、次の手から置いていきます。",refs});
  }

  for (const event of seen.filter(event => event.trace)) {
    const id = event.trace;
    const mark = traces[id];
    const group = shape(svg,"g",{class:"trace"});
    shape(group,"path",{d:mark.path,fill:"none",stroke:mark.color,"stroke-opacity":0,"stroke-width":15,"pointer-events":"stroke"});
    const attrs = {d:mark.path,fill:"none",stroke:mark.color,"stroke-width":1.7,"stroke-opacity":.65,"stroke-linecap":"round",class:"ink"};
    if (mark.dash) attrs["stroke-dasharray"] = mark.dash;
    if (mark.arrow) attrs["marker-end"] = "url(#arrow)";
    shape(group,"path",attrs);
    if (mark.note) {
      const [x,y,wording] = mark.note;
      shape(group,"text",{x,y,fill:mark.color,"font-size":15,"text-anchor":"middle"},wording);
    }
    const linkedPoints = mark.refs.map(ref => points.find(point => point[0] === ref)[3]);
    selectable(group,mark.label || linkedPoints.join("、")+" のつながり",{id,refs:mark.refs,label:mark.label || "この形で見えたこと",reason:mark.reason,extra:(events.indexOf(event)+1)+"手目",sourceIndex:mark.sourceIndex});
  }

  for (const [id,x,y,label,color,reason,section,size=16] of points) {
    if (!existing.has(id)) continue;
    const muted = selection?.refs && !selection.refs.includes(id);
    const group = shape(svg,"g",{class:"point"+(muted?" ghost":"")+(selection?.id===id?" active":"")});
    shape(group,"circle",{cx:x,cy:y,r:14,fill:color,"fill-opacity":0});
    shape(group,"circle",{cx:x,cy:y,r:size>23?13:8,fill:"none",stroke:color,"stroke-width":1,opacity:0,class:"ring"});
    const slant = {m1:-3,v0:-2,h2:2,n2:-4}[id] || 0;
    if (id === "publish") {
      shape(group,"rect",{x:x-90,y:y-23,width:180,height:45,rx:5,fill:"#f7f8ee",stroke:color,"stroke-width":1.6});
      shape(group,"text",{x,y:y+8,fill:color,"text-anchor":"middle","font-size":size,"font-weight":700},label);
    } else {
      shape(group,"circle",{cx:x,cy:y,r:size>23?4:2.8,fill:color});
      shape(group,"text",{x:x+10,y:y+5,fill:size>=22?color:"#1d3038","font-size":size,"font-weight":size>=20?700:500,transform:"rotate("+slant+" "+x+" "+y+")"},label);
    }
    selectable(group,label,{id,label,reason,extra:source_text.sources[section][1]+"　•　"+(events.findIndex(event=>event.point===id)+1)+"手目",sourceIndex:section});
  }

  if (names) for (const [id,x,y,name,refs,reason,anchor="start"] of groups) {
    const group = shape(svg,"g",{class:"island-label"});
    const angle = {a:-4,b:-2,c:1,d:-2,e:-3,f:2,g:-2,h:-3}[id];
    shape(group,"text",{x,y,fill:fields[id].color,"font-size":["e","f"].includes(id)?18:21,"font-weight":700,"text-anchor":anchor,transform:"rotate("+angle+" "+x+" "+y+")"},name);
    selectable(group,name,{id,label:name,reason,refs});
  }
  if (selection) {
    labelInfo(selection.label,selection.reason,selection.extra,selection.sourceIndex);
    return;
  }
  if (step === events.length) {
    labelInfo("点・群れの名・つながりを選ぶ", "ひし形の点は調査中に置いた問い。選ぶと、そこから浮かんだ点が見えます。", "「最初から」で、点や形が現れた順を見られます。");
    return;
  }
  if (step === 0) {
    labelInfo("描き始め", "「›」で、一つずつ図に置いていきます。");
    return;
  }
  const event = events[step-1];
  if (event.point) {
    const point = points.find(point => point[0] === event.point);
    labelInfo(point[3],point[5],source_text.sources[point[6]][1],point[6]);
  } else if (event.topic !== undefined) {
    const topic = topics[event.topic];
    labelInfo(topic.title,"この問いで、気になったところを次の手から置きます。");
  } else if (event.trace) {
    const trace = traces[event.trace];
    labelInfo(trace.label || "形を置く",trace.reason);
  } else {
    labelInfo(event.caption,event.reason);
  }
}

function goTo(value) {
  step = Math.max(0,Math.min(events.length,value));
  selection = null;
  render();
}
document.querySelector("#start").onclick = () => goTo(0);
document.querySelector("#back").onclick = () => goTo(step-1);
document.querySelector("#next").onclick = () => goTo(step+1);
document.querySelector("#all").onclick = () => goTo(events.length);
range.oninput = () => goTo(Number(range.value));
const sourceList = document.querySelector("#dialogue");
for (const [publisher,title,url] of source_text.sources) {
  const item = document.createElement("li");
  const link = document.createElement("a");
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener";
  link.textContent = publisher+" · "+title;
  item.append(link);
  sourceList.append(item);
}
render();
</script>
</html>
